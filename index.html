
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Semana 5</title>
</head>
<body>

    <h1>Atividade de Desenvolvimento Web</h1>

    <h2>Parte 1 - Pedidos</h2>

    <button id="botaoPedidos">Analisar pedidos</button>
    <p id="resultadoPedidos"></p>

    <hr>

    <h2>Parte 2 - Buscar CEP</h2>

    <form id="formCep">
        <input
            type="text"
            id="cep"
            placeholder="Digite o CEP"
        >

        <button type="submit" id="botaoCep">
            Buscar
        </button>
    </form>

    <p id="statusCep"></p>
    <div id="resultadoCep"></div>

    <h3>Histórico de CEPs</h3>
    <ul id="historico"></ul>

    <hr>

    <h2>Parte 3 - Mini Pokédex</h2>

    <form id="formPokemon">
        <input
            type="text"
            id="pokemon"
            placeholder="Nome do Pokémon"
        >

        <button type="submit" id="botaoPokemon">
            Buscar Pokémon
        </button>
    </form>

    <p id="statusPokemon"></p>
    <div id="resultadoPokemon"></div>

    <script src="app.js"></script>
</body>
</html>
